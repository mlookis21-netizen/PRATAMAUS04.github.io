name: Build and publish MAVIKO Android APK

on:
  push:
    branches:
      - android-apk
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maviko-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAVIKO-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: MAVIKO Android v1.0.0
          body: |
            MAVIKO Android app — initial debug release.

            **Install:** Download `MAVIKO-v1.0.0-debug.apk` below and install it on an Android device.
            **Note:** This is a debug build. Some authentication flows (especially Google sign-in in WebView) may need device testing.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: MAVIKO-v1.0.0-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
