
<!DOCTYPE html>
<html lang="id">
<head>
  <!-- =========================================
       1. PENGATURAN DASAR
  ========================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d7c72">

  <title>Info &amp; Komunikasi</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS utama -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- =========================================
       2. HEADER
  ========================================== -->
  <header class="top" id="top">
    <h1>Info &amp; Komunikasi</h1>
  </header>

  <!-- =========================================
       3. KONTEN UTAMA
  ========================================== -->
  <main>

    <!-- 3.1 LOGIN DAN PENDAFTARAN -->
    <section id="v-auth" class="view">
      <div class="card">
        <h2>Masuk atau buat akun</h2>

        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="nama@email.com"
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Minimal 6 karakter"
        >

        <div class="row">
          <button class="btn primary" id="btnLogin" type="button">
            Login
          </button>

          <button class="btn soft" id="btnSignup" type="button">
            Daftar
          </button>
        </div>

        <button class="btn ghost full" id="btnGoogle" type="button">
          Lanjut dengan Google
        </button>

        <p id="authMsg" class="note" role="status"></p>
      </div>
    </section>

    <!-- 3.2 DAFTAR PERCAKAPAN -->
    <section id="v-chats" class="view hidden">
      <div class="head">
        <h2>Pesan</h2>

        <button class="btn soft sm" id="btnRefresh" type="button">
          Refresh
        </button>
      </div>

      <div id="inboxList" class="list"></div>
    </section>

    <!-- 3.3 RUANG CHAT -->
    <section id="v-room" class="view hidden room">
      <div class="room-head">
        <button
          class="icon"
          id="btnBackRoom"
          type="button"
          aria-label="Kembali ke pesan"
        >
          ←
        </button>

        <div id="roomAvatar"></div>

        <div class="grow">
          <strong id="roomName"></strong>
          <small id="roomUser"></small>
        </div>
      </div>

      <div id="roomMsgs" class="msgs"></div>

      <form id="roomForm" class="composer">
        <input
          id="roomInput"
          type="text"
          placeholder="Tulis pesan"
          autocomplete="off"
        >

        <button class="btn primary" id="btnSend" type="submit">
          Kirim
        </button>
      </form>
    </section>

    <!-- 3.4 STATUS 24 JAM -->
    <section id="v-status" class="view hidden">
      <div class="head">
        <h2>Status</h2>
      </div>

      <form id="statusForm" class="card">
        <textarea
          id="statusText"
          rows="3"
          maxlength="300"
          placeholder="Tulis status, atau pilih foto"
        ></textarea>

        <div class="row">
          <label class="btn soft file">
            Pilih foto
            <input
              id="statusFile"
              type="file"
              accept="image/*"
              hidden
            >
          </label>

          <button class="btn primary" type="submit">
            Bagikan status
          </button>
        </div>

        <small class="note" id="statusNote">
          Status aktif 24 jam.
        </small>
      </form>

      <div id="statusList" class="list"></div>
    </section>

    <!-- 3.5 BERANDA DAN POSTINGAN -->
    <section id="v-feed" class="view hidden">
      <div class="head">
        <h2>Beranda</h2>
      </div>

      <form id="postForm" class="card">
        <textarea
          id="postCaption"
          rows="2"
          maxlength="500"
          placeholder="Tulis caption"
        ></textarea>

        <img
          id="postPreview"
          class="preview hidden"
          alt="Pratinjau foto"
        >

        <div class="row">
          <label class="btn soft file">
            Pilih foto
            <input
              id="postFile"
              type="file"
              accept="image/*"
              hidden
            >
          </label>

          <button class="btn primary" type="submit">
            Posting
          </button>
        </div>
      </form>

      <div id="feedList" class="list"></div>
    </section>

    <!-- 3.6 PENCARIAN PENGGUNA -->
    <section id="v-search" class="view hidden">
      <div class="head">
        <h2>Cari pengguna</h2>
      </div>

      <form id="searchForm" class="row nowrap">
        <input
          id="searchInput"
          type="search"
          placeholder="Ketik username"
          autocomplete="off"
        >

        <button class="btn primary" type="submit">
          Cari
        </button>
      </form>

      <div id="searchList" class="list"></div>
    </section>

    <!-- 3.7 PROFIL PENGGUNA LAIN -->
    <section id="v-user" class="view hidden">
      <div class="head">
        <button class="btn soft sm" id="btnBackUser" type="button">
          ← Kembali
        </button>
      </div>

      <div id="userCard" class="card center"></div>
    </section>

    <!-- 3.8 PROFIL SAYA -->
    <section id="v-profile" class="view hidden">
      <div class="head">
        <h2>Profil saya</h2>
      </div>

      <form id="profileForm" class="card">
        <div id="myAvatar" class="center"></div>

        <p class="note" id="myEmail"></p>

        <label for="pUsername">Username</label>
        <input
          id="pUsername"
          maxlength="20"
          placeholder="huruf, angka, titik, garis bawah"
        >

        <label for="pName">Nama lengkap</label>
        <input id="pName" maxlength="60">

        <label for="pBio">Bio</label>
        <textarea id="pBio" rows="3" maxlength="200"></textarea>

        <label for="pWebsite">Website</label>
        <input
          id="pWebsite"
          type="url"
          placeholder="https://"
        >

        <label for="pLocation">Lokasi</label>
        <input id="pLocation" maxlength="60">

        <label class="btn soft file">
          Ganti foto profil
          <input
            id="pAvatarFile"
            type="file"
            accept="image/*"
            hidden
          >
        </label>

        <div class="row">
          <button class="btn primary" type="submit">
            Simpan profil
          </button>

          <button
            type="button"
            class="btn danger"
            id="btnLogout"
          >
            Logout
          </button>
        </div>
      </form>
    </section>

  </main>

  <!-- =========================================
       4. NAVIGASI BAWAH
  ========================================== -->
  <nav id="tabs" class="hidden" aria-label="Menu utama">
    <button type="button" data-view="chats">Pesan</button>
    <button type="button" data-view="status">Status</button>
    <button type="button" data-view="feed">Beranda</button>
    <button type="button" data-view="search">Cari</button>
    <button type="button" data-view="profile">Profil</button>
  </nav>

  <!-- =========================================
       5. NOTIFIKASI
  ========================================== -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- =========================================
       6. PENAMPIL STATUS LAYAR PENUH
  ========================================== -->
  <div id="viewer" class="viewer hidden">
    <button
      class="icon"
      id="viewerClose"
      type="button"
      aria-label="Tutup"
    >
      ✕
    </button>

    <div id="viewerBody"></div>
  </div>

  <!-- =========================================
       7. SUPABASE DAN JAVASCRIPT
  ========================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>

</body>
</html>
